name: update-data

on:
  schedule:
    - cron: '7 * * * *'      # 매시 7분(UTC) — 관측값(수온·기온·바람)
    - cron: '17 19 * * *'    # 매일 04:17 KST — 조석예보
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      what:
        description: 'tides / obs / both'
        default: 'both'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        env:
          KHOA_KEY: ${{ secrets.KHOA_KEY }}
        run: |
          WHAT="${{ github.event.inputs.what }}"
          if [ -z "$WHAT" ]; then
            if [ "${{ github.event.schedule }}" = "17 19 * * *" ]; then WHAT=tides; else WHAT=obs; fi
            # 조석 파일이 아직 없으면 같이 받기
            ls data/tide/*.json >/dev/null 2>&1 || WHAT=both
          fi
          if [ "$WHAT" = "tides" ] || [ "$WHAT" = "both" ]; then python scripts/fetch.py tides; fi
          if [ "$WHAT" = "obs" ] || [ "$WHAT" = "both" ]; then python scripts/fetch.py obs; fi
      - name: Commit
        run: |
          git config user.name "tide-bot"
          git config user.email "tide-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs && git push
